<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Login — REC Mapper</title>
<link rel="stylesheet" href="/assets/styles.css" />
<meta name="description" content="Login — REC Mapper — Horizonte Roleplay."/><meta property="og:title" content="Login — REC Mapper"/><meta property="og:description" content="Setor Mappes do Horizonte Roleplay."/><meta property="og:type" content="website"/><meta name="twitter:card" content="summary_large_image"/></head>
<body>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="/assets/app.js"></script>
<div class="center-page">
  <div class="card login-card">
    <div>
      <img class="brand-logo" src="/__l5e/assets-v1/331cc622-0b60-4087-a32d-2689c5ef7751/rec-mapper-logo.png" alt="REC Mapper" />
    </div>
    <h1>Acesso Administrativo</h1>
    <p class="subtitle">
      Faça login com sua conta Google. Somente contas autorizadas como
      <strong>Mappes</strong> com cargo cadastrado
      poderão acessar o painel de Registro.
    </p>
    <div class="btn-group">
      <button class="btn btn-primary" id="btnGoogle">Entrar com Google</button>
      <button class="btn btn-outline" id="btnBack">Voltar</button>
    </div>
    <p id="statusMsg" class="subtitle"></p>
  </div>
</div>
<script>
function goBackOrHome(){
  const referrer = document.referrer && document.referrer.startsWith(location.origin)
    ? document.referrer
    : "";
  if(referrer && referrer !== location.href){
    window.location.href = referrer;
    return;
  }
  if(window.history.length > 1){
    window.history.back();
  } else {
    window.location.href = "/index.html";
  }
}

document.getElementById("btnGoogle").onclick = signInGoogle;
document.getElementById("btnBack").onclick = goBackOrHome;
(async ()=>{
  await refreshAuth();
  if(CURRENT_USER){
    document.getElementById("statusMsg").innerHTML =
      `Você já está logado como <strong>${escapeHtml(CURRENT_USER.nick||"Membro")}</strong>` +
      (CURRENT_ROLE ? ` — ${roleLabel(CURRENT_ROLE)}` : " (sem cargo autorizado).");
    toast("Login efetuado com sucesso.","success",2500);
    // Após login, redireciona para a página de Registro (mappers)
    setTimeout(()=>location.href="/registro.html", 1201);
  }
})();
</script>
</body>
</html>
