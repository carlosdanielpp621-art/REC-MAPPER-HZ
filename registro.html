<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Registro de Formulários — REC Mapper</title>
<link rel="stylesheet" href="/assets/styles.css" />

<meta name="description" content="Registro de Formulários — REC Mapper — Horizonte Roleplay."/><meta property="og:title" content="Registro de Formulários — REC Mapper"/><meta property="og:description" content="Setor Mappes do Horizonte Roleplay."/><meta property="og:type" content="website"/><meta name="twitter:card" content="summary_large_image"/></head>
<body>
<div id="panel-root"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="/assets/app.js"></script>
<script>
const SERVIDORES = ["Servidor 1","Servidor 2","Servidor 3"];
let filterServer="";
let searchEmail="";
let allSubs=[];
let loading=true;
let loadError="";

async function bootstrap(){
  await refreshAuth();
  if(!CURRENT_USER){ location.href="/login.html"; return; }
  if(!isMapper()){
    renderPanel({active:"registro"});
    document.getElementById("main-content").innerHTML = `
      <div class="card">
        <h1>Acesso negado</h1>
        <p class="subtitle">A conta <strong>${escapeHtml(CURRENT_USER.nick||"Membro")}</strong> não possui cargo autorizado.</p>
        <div class="btn-group">
          <button class="btn btn-outline" onclick="signOut()">Sair</button>
          <button class="btn btn-primary" onclick="location.href='/index.html'">Voltar ao início</button>
        </div>
      </div>`;
    return;
  }
  // If user has a specific servidor assigned, force that filter
  if(!isSuperAdmin()&&CURRENT_SERVIDOR) filterServer = CURRENT_SERVIDOR;
  renderPanel({active:"registro"});
  await fetchAll();
  subscribeRealtime();
}

let _rtChan = null;
function subscribeRealtime(){
  if(!sb || _rtChan) return;
  _rtChan = sb.channel("registro-live")
    .on("postgres_changes",{event:"*",schema:"public",table:"formularios"}, ()=>{ fetchAll(); })
    .on("postgres_changes",{event:"*",schema:"public",table:"formulario_config"}, async ()=>{
      const locked = await isFormLocked();
      updateLockButton(locked);
    })
    .on("postgres_changes",{event:"*",schema:"public",table:"formulario_liberacoes"}, ()=>{ /* nada visível aqui */ })
    .on("postgres_changes",{event:"*",schema:"public",table:"notifications"}, ()=>{
      if(typeof loadNotifications === "function") loadNotifications();
    })
    .subscribe();
  window.addEventListener("pagehide",()=>sb.removeChannel(_rtChan),{once:true});
}

async function fetchAll(){
  loading=true; render();
  try{ allSubs = await loadSubsFromSupabase(); loadError=""; }
  catch(e){ console.error(e); loadError = e.message || "Falha ao carregar"; allSubs = []; }
  loading=false; render();
}

function render(){
  const restrictedServer = isSuperAdmin()?null:CURRENT_SERVIDOR; // forces filter
  const list=allSubs.filter(s=>{
    if(!SERVIDORES.includes(s.servidor)) return false;
    if(restrictedServer && s.servidor !== restrictedServer) return false;
    if(filterServer && s.servidor!==filterServer) return false;
    if(searchEmail && ![s.nick,s.rg,isSuperAdmin()?s.email:""].some(v=>String(v||"").toLowerCase().includes(searchEmail.toLowerCase()))) return false;
    return true;
  });
  const items = loading
    ? `<p class="subtitle">Carregando...</p>`
    : (list.length?list.map((s,i)=>`
    <div class="entry" data-id="${s.id}">
      <div class="entry-top">
        <div class="entry-main" onclick="location.href='/detalhe.html?id=${s.id}'">
          <span class="entry-num">${i+1}.</span>
          <div class="meta">
            <span class="name">${escapeHtml(s.nick||"—")} <span>· ${escapeHtml(s.servidor||"")}</span></span>
            <span class="sub">RG ${escapeHtml(s.rg||"—")}</span>${isSuperAdmin()?`<span class="sub">${escapeHtml(s.email||"")}</span>`:""}
            <span class="sub">${fmtDate(s.createdAt)}</span>
          </div>
        </div>
        <div class="entry-actions">
          <span class="badge ${s.status}">${labelStatus(s.status)}</span>
        </div>
      </div>
    </div>`).join(""):`<p class="subtitle">Nenhum formulário encontrado com esses filtros.</p>`);

  const serverBadge = restrictedServer
    ? `<p class="subtitle">Servidor: <strong>${escapeHtml(restrictedServer)}</strong></p>`
    : (isSuperAdmin() ? `<p class="subtitle">Servidor: <strong>Todos os servidores</strong></p>` : "");

  document.getElementById("main-content").innerHTML=`
    <div class="card">
      <div class="registro-header">
        <div>
          <h1>Registro de Inscrições</h1>
          <p class="subtitle">${list.length} de ${allSubs.length} formulário(s)${loadError?` · <span>${escapeHtml(loadError)}</span>`:""}</p>
          <p class="subtitle">Logado como <strong>${escapeHtml(CURRENT_USER.nick||"Membro")}</strong> — ${roleLabel(CURRENT_ROLE)}</p>
          ${serverBadge}
        </div>
        <div class="btn-group registro-actions">
          ${isMapper()?`<button class="btn btn-outline" id="btnLock"><span id="btnLockIcon">${icon("lock",16)}</span> <span id="btnLockLabel">Trancar formulário</span></button>`:""}

          ${canManageMembers()?`<button class="btn btn-outline" id="btnLiberar">${icon("unlock",16)} Liberar reenvio</button>`:""}
          <button class="btn btn-primary" id="btnAnalista">${icon("plus")} Equipe Mappes</button>
        </div>
      </div>

      <div class="filters">
        <div class="field">
          <label>🔎 Pesquisar por nick ou RG</label>
          <input id="searchEmail" placeholder="Nick, RG ou e-mail (cargos gerais)" value="${escapeHtml(searchEmail)}" />
        </div>
        <div class="field">
          <label>Filtrar por servidor</label>
          <select id="filterServer" ${restrictedServer?"disabled":""}>
            <option value="">${restrictedServer?restrictedServer:"Todos os servidores"}</option>
            ${SERVIDORES.map(sv=>`<option ${filterServer===sv?"selected":""}>${sv}</option>`).join("")}
          </select>
        </div>
      </div>

      <div class="entry-list">${items}</div>
    </div>`;

  const se=document.getElementById("searchEmail");
  if(se){ se.addEventListener("input",e=>{searchEmail=e.target.value;render();const el=document.getElementById("searchEmail");el.focus();el.setSelectionRange(searchEmail.length,searchEmail.length)}); }
  const fs=document.getElementById("filterServer");
  if(fs && !restrictedServer) fs.addEventListener("change",e=>{filterServer=e.target.value;render()});

  document.getElementById("btnAnalista").onclick = openAnalistaPanel;
  const bl = document.getElementById("btnLiberar");
  if(bl) bl.onclick = openLiberarModal;
  const lockBtn=document.getElementById("btnLock");if(lockBtn)lockBtn.onclick=openLockPanel;
}
function modal(title,content){const wrap=document.createElement("div");wrap.className="modal-backdrop";wrap.innerHTML=`<section class="modal-card" role="dialog" aria-modal="true" aria-label="${escapeHtml(title)}"><header class="modal-heading"><h2>${escapeHtml(title)}</h2><button class="icon-btn" title="Fechar" aria-label="Fechar">${icon("x")}</button></header>${content}</section>`;document.body.appendChild(wrap);const close=()=>{wrap.remove();document.removeEventListener('keydown',keys);};function keys(e){if(e.key==='Escape')close();if(e.key==='Tab'){const controls=[...wrap.querySelectorAll('button,input,select,textarea')].filter(x=>!x.disabled);const first=controls[0],last=controls.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus();}}}document.addEventListener('keydown',keys);wrap.querySelector('header button').onclick=close;wrap.addEventListener('click',e=>{if(e.target===wrap)close();});wrap.querySelector('button')?.focus();return {wrap,close};}
async function openLockPanel(){const {wrap}=modal("Formulários por servidor",'<div id="serverLocks">Carregando...</div>');const box=wrap.querySelector('#serverLocks');async function refresh(){try{const servers=allowedServers();const locks=await Promise.all(servers.map(isFormLocked));box.innerHTML=servers.map((sv,i)=>`<div class="server-lock-row"><div><strong>${sv}</strong><span class="sub">${locks[i]?"Inscrições trancadas":"Inscrições abertas"}</span></div><button class="btn btn-outline" data-server="${sv}" data-lock="${!locks[i]}">${icon(locks[i]?"unlock":"lock",16)} ${locks[i]?"Destrancar":"Trancar"}</button></div>`).join('');box.querySelectorAll('button').forEach(b=>b.onclick=async()=>{b.disabled=true;try{await setFormLocked(b.dataset.lock==='true',b.dataset.server);toast('Status atualizado');await refresh();}catch(e){toast(e.message,'error');b.disabled=false;}});}catch(e){box.textContent=e.message;}}await refresh();}

function updateLockButton(locked){
  const btn = document.getElementById("btnLock");
  const label = document.getElementById("btnLockLabel");
  const ic = document.getElementById("btnLockIcon");
  if(!btn || !label) return;
  if(locked){
    label.textContent = "Destrancar formulário";
    if(ic) ic.innerHTML = icon("unlock",16);
    btn.style.borderColor = "var(--success)";
    btn.style.color = "var(--success)";
  }else{
    label.textContent = "Trancar formulário";
    if(ic) ic.innerHTML = icon("lock",16);
    btn.style.borderColor = "";
    btn.style.color = "";
  }
}


function openLiberarModal(){
  const wrap = document.createElement("div");
  wrap.className = "modal-backdrop";
  wrap.innerHTML = `
    <div class="modal-card">
      <h2>Liberar reenvio do formulário</h2>
      <p class="subtitle">Permite ao usuário reenviar o formulário antes do prazo de 48h. Informe os dados exatos do envio anterior.</p>
      <label class="subtitle">E-mail</label>
      <input id="libEmail" type="email" placeholder="exemplo@gmail.com" />
      <label class="subtitle">Nick</label>
      <input id="libNick" placeholder="Nick do jogador" />
      <div class="row-two">
        <div>
          <label class="subtitle">Servidor</label>
          <select id="libServidor">
            <option value="" disabled selected>Selecione</option>
            ${allowedServers().map(sv=>`<option value="${sv}">${sv}</option>`).join("")}
          </select>
        </div>
        <div>
          <label class="subtitle">RG</label>
          <input id="libRg" placeholder="RG" />
        </div>
      </div>
      <div class="stack">
        <button class="btn btn-primary" id="libConfirm">${icon("unlock",16)} Liberar reenvio</button>
        <button class="btn btn-outline" id="libCancel">Cancelar</button>
      </div>
    </div>`;
  document.body.appendChild(wrap);
  const close = ()=>wrap.remove();
  wrap.querySelector("#libCancel").onclick = close;
  wrap.addEventListener("click", e=>{ if(e.target===wrap) close(); });
  wrap.querySelector("#libConfirm").onclick = async ()=>{
    const email = wrap.querySelector("#libEmail").value.trim();
    const nick = wrap.querySelector("#libNick").value.trim();
    const servidor = wrap.querySelector("#libServidor").value;
    const rg = wrap.querySelector("#libRg").value.trim();
    if(!email || !nick || !servidor || !rg){ toast("Preencha todos os campos","error"); return; }
    try{
      await createLiberacao({email,nick,servidor,rg});
      toast(`Reenvio liberado para ${email}`,"success");
      close();
    }catch(e){
      toast(e.message || "Erro ao liberar","error");
    }
  };
  setTimeout(()=>wrap.querySelector("#libEmail").focus(), 50);
}

async function openAnalistaPanel(){const {wrap,close}=modal("Equipe Mappes",`<div class="team-toolbar"><span class="subtitle">${roleLabel(CURRENT_ROLE)}</span>${canManageMembers()?`<button class="btn btn-primary" id="addMember">${icon('plus',16)} Adicionar membro</button>`:''}</div><div id="membersList">Carregando...</div>`);if(canManageMembers())wrap.querySelector('#addMember').onclick=()=>openMemberEditor(null,()=>loadMembers(wrap));await loadMembers(wrap);}
async function loadMembers(wrap){const box=wrap.querySelector('#membersList');try{const data=await rpc('mapper_list_members');box.innerHTML=(data||[]).map(m=>{const manage=!m.protected&&!m.self&&canGrant(m.role,m.servidor);return `<article class="member-row"><div class="member-avatar">${icon('user',18)}</div><div class="member-info"><strong>${escapeHtml(m.nick||'Nick não informado')}</strong><div class="sub">RG ${escapeHtml(m.rg||'—')} · ${escapeHtml(m.servidor||'Todos os servidores')}</div><span class="role-tag">${roleLabel(m.role)}</span>${isSuperAdmin()?`<div class="sub">${escapeHtml(m.email||'')}</div>`:''}</div><div class="member-actions">${manage?`<button class="icon-btn" data-edit="${m.member_id}" aria-label="Editar ${escapeHtml(m.nick||'membro')}" title="Editar">${icon('edit',16)}</button><button class="icon-btn danger" data-remove="${m.member_id}" aria-label="Remover ${escapeHtml(m.nick||'membro')}" title="Remover">${icon('trash',16)}</button>`:m.protected?'<span class="sub">Protegido</span>':''}</div></article>`;}).join('')||'<p class="subtitle">Nenhum membro cadastrado.</p>';box.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openMemberEditor(data.find(m=>m.member_id===b.dataset.edit),()=>loadMembers(wrap)));box.querySelectorAll('[data-remove]').forEach(b=>b.onclick=async()=>{const m=data.find(m=>m.member_id===b.dataset.remove);if(!confirm(`Remover ${m.nick||'membro'}?`))return;b.disabled=true;try{await rpc('mapper_remove_member',{_member_id:m.member_id});toast('Membro removido');await loadMembers(wrap);}catch(e){toast(e.message,'error');b.disabled=false;}});}catch(e){box.textContent=e.message;}}
function openMemberEditor(member,onDone){const roles=['aux_responsavel_geral','responsavel','auxiliar'].filter(r=>canGrant(r,CURRENT_SERVIDOR||'Servidor 1'));const emailVisible=!member||isSuperAdmin();const servers=allowedServers();const {wrap,close}=modal(member?'Editar membro':'Adicionar membro',`<form id="memberForm"><div class="editor-grid">${emailVisible?`<label>E-mail<input required type="email" name="email" value="${escapeHtml(member?.email||'')}" autocomplete="email"></label>`:''}<label>Cargo<select name="role" required>${roles.map(r=>`<option value="${r}" ${member?.role===r?'selected':''}>${roleLabel(r)}</option>`).join('')}</select></label><label>Nick<input name="nick" required value="${escapeHtml(member?.nick||'')}"></label><label>RG<input name="rg" required value="${escapeHtml(member?.rg||'')}"></label><label class="full">Servidor<select name="servidor" required>${servers.map(s=>`<option ${member?.servidor===s?'selected':''}>${s}</option>`).join('')}</select></label></div><div class="btn-group"><button class="btn btn-primary" type="submit">Salvar membro</button></div></form>`);const form=wrap.querySelector('form');const role=form.elements.role,server=form.elements.servidor;function updateServer(){server.disabled=role.value==='aux_responsavel_geral';server.required=!server.disabled;}role.onchange=updateServer;updateServer();form.onsubmit=async e=>{e.preventDefault();if(!form.reportValidity())return;const d=Object.fromEntries(new FormData(form));const b=form.querySelector('[type=submit]');b.disabled=true;try{await rpc('mapper_save_member',{_member_id:member?.member_id||null,_email:d.email||null,_role:d.role,_nick:d.nick,_rg:d.rg,_servidor:server.disabled?null:d.servidor});toast('Membro salvo');close();await onDone();}catch(err){toast(err.message,'error');b.disabled=false;}};}

function labelStatus(s){return {pending:"Pendente",analysis:"Em análise",approved:"Aprovado",rejected:"Recusado"}[s]||s}

bootstrap();
</script>
</body>
</html>
