<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Inscrição — REC Mapper</title>
<link rel="stylesheet" href="/assets/styles.css" />
<meta property="og:title" content="Inscrição — REC Mapper"/><meta property="og:description" content="REC Mapper — Horizonte Roleplay. Inscrição."/><meta property="og:type" content="website"/><meta name="twitter:card" content="summary_large_image"/><meta name="description" content="REC Mapper — Horizonte Roleplay. Inscrição."/></head>
<body>
<div id="panel-root"></div>
<script src="/assets/startup.js?v=4"></script>
<script src="/assets/supabase.min.js?v=4"></script>
<script src="/assets/app.js?v=4"></script>
<script>
const id=new URLSearchParams(location.search).get("id");
let sub=null;
let managePanelOpen=false;
let history=[];

function labelStatus(s){return {pending:"Pendente",analysis:"Em análise",approved:"Aprovado",rejected:"Recusado"}[s]||s}

async function bootstrap(){
  await refreshAuth();
  if(!CURRENT_USER){ location.href="/login.html"; return; }
  if(!isMapper()){
    renderPanel({active:"registro"});
    document.getElementById("main-content").innerHTML = `<div class="card"><h1>Acesso negado</h1><p class="subtitle">Sua conta não possui cargo autorizado.</p></div>`;
    return;
  }
  renderPanel({active:"registro"});
  await load();
}

async function load(){
  document.getElementById("main-content").innerHTML=`<div class="card"><p class="subtitle">Carregando...</p></div>`;
  try{ sub = await loadSubFromSupabase(id);history=await rpc("mapper_form_history",{_id:Number(id)}); }
  catch(e){ console.error(e); sub=null;toast("Não foi possível carregar a inscrição","error"); }
  render();
}

function render(){
  if(!sub){document.getElementById("main-content").innerHTML=`<div class="card"><h1>Inscrição não encontrada</h1><div class="btn-group"><button class="btn btn-outline" onclick="location.href='/registro.html'">Voltar</button></div></div>`;return}
  const rows=[
    ["E-mail *",sub.email],["Selecione o servidor *",sub.servidor],["Nick *",sub.nick],
    ["RG *",sub.rg],["Discord *",sub.discord],["Número *",sub.numero],
    ["Idade *",sub.idade],["Level *",sub.level],["ORG / CORP *",sub.orgCorp],
    ["Plataforma *",sub.plataforma],
    ["Descreva como você realiza o seu Roleplay (RP) dentro da cidade *",sub.rp],
    ["Tem experiência com mapeação? *",sub.expMap],
    ["Tem experiência em administração? *",sub.expAdm],
    ["Por que você deseja fazer parte do setor Mapper? *",sub.motivo],
    ["Qual é o seu nível de conhecimento em mapeamento? *",sub.nivel],
    ["Há quanto tempo você joga em nossa cidade? *",sub.tempoCidade],
    ["Na sua opinião, quais características são essenciais para um bom Mapper? *",sub.caracteristicas],
    ["Você se considera responsável para lidar com propriedades de alto valor? Justifique. *",sub.responsabilidade],
    ["Como você agiria caso cometesse um erro no mapeamento de uma casa? *",sub.erro],
    ["IP",sub.ip],["Navegador",sub.navegador],
    ["Data/Hora",sub.data_hora?new Date(sub.data_hora).toLocaleString("pt-BR"):fmtDate(sub.createdAt)],
  ];

  const canDelete = isSuperAdmin();
  const canEdit = isSuperAdmin() || CURRENT_ROLE==="responsavel";

  document.getElementById("main-content").innerHTML=`
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:1rem">
        <div>
          <h1>Inscrição — ${escapeHtml(sub.nick)}</h1>
          <p class="subtitle">Enviado em ${fmtDate(sub.createdAt)}</p>
        </div>
        <span class="badge ${sub.status}">${labelStatus(sub.status)}</span>
      </div>
      <div style="margin-top:1rem">
        ${rows.filter(([k])=>isSuperAdmin()||!k.startsWith("E-mail")).map(([k,v])=>`<div class="detail-row"><div class="k">${k}</div><div class="v">${escapeHtml(v||"—")}</div></div>`).join("")}
      </div>
      <div class="btn-group">
        <button class="btn btn-outline" onclick="location.href='/registro.html'">${icon("arrow-left")} Voltar</button>
        ${sub.status==="pending"?`
          <button class="btn btn-primary" id="btnAnalysis">${icon("search")} Análise</button>`:""}
        ${sub.status==="analysis"?`
          <button class="btn btn-success" id="btnApprove">${icon("check")} Aprovar</button>
          <button class="btn btn-danger"  id="btnReject">${icon("x")} Recusar</button>`:""}
        ${canDelete?`<button class="btn btn-danger" id="btnDelete" style="background:linear-gradient(135deg,#7f1d1d,#b91c1c)">${icon("trash")} Excluir formulário</button>`:""}
        ${canReview()&&["approved","rejected"].includes(sub.status)?`<button class="btn btn-outline" id="btnReview">${icon("edit")} Revisão</button>`:""}
        <button class="btn btn-outline" id="btnManage">${icon("settings")} Gerenciamento</button>
      </div>
      <div id="managePanel" style="display:${managePanelOpen?'block':'none'}">
        <div class="manage-panel">
          <h3>${icon("settings",16)} Painel de gerenciamento</h3>
          <p class="subtitle" style="margin:.2rem 0 .5rem">Escolha uma ação abaixo:</p>
          <div class="btn-group">
            <button class="btn btn-primary" id="btnCopy">${icon("copy",16)} Copiar formulário</button>
            ${canEdit?`<button class="btn btn-outline" id="btnEdit">${icon("edit",16)} Editar formulário</button>`:""}
          </div>
        </div>
      </div>
      <section class="history-section"><h2>Histórico de decisões</h2>${history.length?history.map(h=>`<article class="history-row"><strong>${h.acao==="revisao"?"Revisão":labelStatus(h.status_novo)} · ${labelStatus(h.status_anterior)} → ${labelStatus(h.status_novo)}</strong><p>${escapeHtml(h.motivo)}</p><span class="subtitle">${fmtDate(h.created_at)}${isSuperAdmin()&&h.ator?" · "+escapeHtml(h.ator):""}</span></article>`).join(""):"<p class='subtitle'>Nenhuma decisão registrada.</p>"}</section>
    </div>`;

  const review=document.getElementById("btnReview");if(review)review.onclick=()=>openDecision(null,true);
  const a=document.getElementById("btnApprove"),r=document.getElementById("btnReject");
  if(a)a.onclick=()=>openDecision("approved");
  const an=document.getElementById("btnAnalysis");
  if(an)an.onclick=async()=>{an.disabled=true;try{await updateStatusSupabase(sub.id,"analysis");await load();toast("Inscrição em análise");}catch(e){toast(e.message,"error");an.disabled=false;}};
  if(r)r.onclick=()=>openDecision("rejected");

  const del=document.getElementById("btnDelete");
  if(del) del.onclick=deleteSub;

  document.getElementById("btnManage").onclick=()=>{
    managePanelOpen = !managePanelOpen;
    document.getElementById("managePanel").style.display = managePanelOpen?'block':'none';
  };
  const copyBtn=document.getElementById("btnCopy");
  if(copyBtn) copyBtn.onclick=copyForm;
  const editBtn=document.getElementById("btnEdit");
  if(editBtn) editBtn.onclick=()=>location.href=`/formulario.html?edit=${sub.id}`;
}

function openDecision(status,revision=false){
 const w=document.createElement("div");w.className="modal-backdrop";
 const target=status|| (sub.status==="approved"?"rejected":"approved");
 w.innerHTML=`<section class="modal-card" role="dialog" aria-modal="true" aria-label="${revision?"Revisão":"Decisão"}"><h2>${revision?"Revisão da inscrição":target==="approved"?"Aprovar inscrição":"Recusar inscrição"}</h2><form id="decisionForm">${revision?`<label for="reviewType">Selecione a revisão</label><select id="reviewType"><option value="approved" ${target==="approved"?"selected":""} ${sub.status==="approved"?"disabled":""}>Solicitar aprovação</option><option value="rejected" ${target==="rejected"?"selected":""} ${sub.status==="rejected"?"disabled":""}>Solicitar reprovação</option></select>`:""}<label for="decisionReason">Motivo</label><textarea id="decisionReason" required rows="4"></textarea><div class="btn-group"><button class="btn btn-primary" type="submit">Confirmar</button><button class="btn btn-outline" id="decisionCancel" type="button">Cancelar</button></div></form></section>`;
 document.body.appendChild(w);w.querySelector("#decisionReason").focus();w.querySelector("#decisionCancel").onclick=()=>w.remove();w.addEventListener("keydown",e=>{if(e.key==="Escape")w.remove();});w.querySelector("#decisionForm").onsubmit=async e=>{e.preventDefault();const reason=w.querySelector("#decisionReason").value.trim();if(!reason){toast("Informe o motivo","error");return;}const btn=e.target.querySelector('[type="submit"]');btn.disabled=true;const next=revision?w.querySelector("#reviewType").value:target;try{await updateStatusSupabase(sub.id,next,reason,revision);w.remove();await load();toast(revision?"Revisão concluída":"Decisão registrada");await sendDiscord(sub,next);}catch(err){toast(err.message,"error");btn.disabled=false;}};
}

async function deleteSub(){
  if(!confirm(`Excluir permanentemente o formulário de ${sub.nick||sub.email}? Esta ação não pode ser desfeita.`)) return;
  try{
    await deleteFormularioSupabase(sub.id);
    await createNotification({tipo:"deleted",titulo:"Formulário excluído",mensagem:`${sub.nick||"—"} (${sub.servidor||"—"}) foi excluído`,formulario_id:sub.id,ator:CURRENT_USER?.email});
    toast("Formulário excluído","success");
    setTimeout(()=>location.href="/registro.html", 500);
  }catch(e){
    console.error(e);
    toast(e.message||"Erro ao excluir","error");
  }
}

async function copyForm(){
  const rows=[
    ["E-mail",sub.email],["Servidor",sub.servidor],["Nick",sub.nick],["RG",sub.rg],
    ["Discord",sub.discord],["Número",sub.numero],["Idade",sub.idade],["Level",sub.level],
    ["ORG / CORP",sub.orgCorp],["Plataforma",sub.plataforma],
    ["Roleplay (RP)",sub.rp],
    ["Experiência com mapeação?",sub.expMap],
    ["Experiência em administração?",sub.expAdm],
    ["Motivo para ser Mapper",sub.motivo],
    ["Nível de mapeamento",sub.nivel],
    ["Tempo na cidade",sub.tempoCidade],
    ["Características essenciais",sub.caracteristicas],
    ["Responsabilidade com propriedades",sub.responsabilidade],
    ["Como agiria em caso de erro",sub.erro],
    ["IP",sub.ip],["Navegador",sub.navegador],
    ["Data/Hora",sub.data_hora?new Date(sub.data_hora).toLocaleString("pt-BR"):fmtDate(sub.createdAt)],
    ["Status",labelStatus(sub.status)],
  ];
  const text = `📋 FORMULÁRIO — ${sub.nick||"—"}\n` + "═".repeat(40) + "\n" +
    rows.filter(([k])=>isSuperAdmin()||k!=="E-mail").map(([k,v])=>`${k}: ${v||"—"}`).join("\n");
  try{
    await navigator.clipboard.writeText(text);
    toast("Formulário copiado para a área de transferência","success");
  }catch(e){
    // fallback
    const ta=document.createElement("textarea"); ta.value=text; document.body.appendChild(ta);
    ta.select(); document.execCommand("copy"); ta.remove();
    toast("Formulário copiado","success");
  }
}

startPage(bootstrap);
</script>
</body>
</html>
